<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="punchlist: build discipline for coding agents">
  <rect width="1200" height="300" fill="#0e1116"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8a94a6" font-size="18">
    <text x="64" y="72">[x] contract approved</text>
    <text x="64" y="104">[x] write blocked: hardcoded key</text>
