  <rect x="64" y="153" width="250" height="22" fill="none" stroke="#5eead4" stroke-width="1.5"/>
  <text x="64" y="244" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#e8ecf3" letter-spacing="-2">punchlist</text>
  <text x="1136" y="244" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5eead4">nothing is done until the last box is checked</text>
